apiVersion: 1

providers:
  - name: 'Default'
    orgId: 1
    folder: ''
    type: file
    # Allow deletion from UI
    disableDeletion: false
    updateIntervalSeconds: 10
    # Allow UI updates
    allowUiUpdates: true
    # Options
    options:
      path: /var/lib/grafana/dashboards
      # Don't create folders based on subdirectories
      foldersFromFilesStructure: false