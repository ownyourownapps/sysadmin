# Arquivo de provisionamento de dashboards do Grafana
# Define onde o Grafana deve procurar dashboards JSON e como carregá-los automaticamente
apiVersion: 1

providers:
  - name: 'Default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

