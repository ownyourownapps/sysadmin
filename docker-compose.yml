networks:
  traefik:
    external: true
  observability:
    driver: bridge


services:
  # Serviços de teste/debug (opcionais - use profile 'debug' para ativar)
  whoami:
    image: traefik/whoami
    container_name: sysadmin-whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`who.${DOMAIN_BASE}`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls.certresolver=le
      - traefik.http.routers.whoami.middlewares=secure-headers,ip-allowlist
    restart: unless-stopped
    networks:
      - traefik

  whoami-api:
    image: traefik/whoami
    container_name: sysadmin-whoami-api
    profiles:
      - debug
    environment:
      - WHOAMI_NAME=API Service
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami-api.rule=Host(`who.${DOMAIN_BASE}`) && PathPrefix(`/api`)
      - traefik.http.routers.whoami-api.entrypoints=websecure
      - traefik.http.routers.whoami-api.tls.certresolver=le
      - traefik.http.routers.whoami-api.middlewares=secure-headers,ip-allowlist
    restart: unless-stopped
    networks:
      - traefik

  prometheus:
    image: prom/prometheus:latest
    container_name: sysadmin-prometheus
    volumes:
      - ${MOUNT_POINT}/prometheus:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Service discovery: add new targets here
      - ./prometheus/targets:/etc/prometheus/targets
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - observability
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_DOMAIN}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=le
      - traefik.http.routers.prometheus.middlewares=secure-headers
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sysadmin-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ${MOUNT_POINT}/grafana:/var/lib/grafana
      - ./grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - observability
      - traefik
    depends_on:
      - prometheus
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.routers.grafana.middlewares=secure-headers
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sysadmin-node-exporter
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sysadmin-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    container_name: sysadmin-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ${MOUNT_POINT}/loki:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - observability
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.loki.rule=Host(`${LOKI_DOMAIN}`)
      - traefik.http.routers.loki.entrypoints=websecure
      - traefik.http.routers.loki.tls.certresolver=le
      - traefik.http.routers.loki.middlewares=secure-headers
      - traefik.http.services.loki.loadbalancer.server.port=3100
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: sysadmin-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - observability
    depends_on:
      - loki
